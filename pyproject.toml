[project]
name = "trading212-ai-bot"
version = "0.1.0"
description = "Read-only Trading 212 portfolio research bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
trading-bot = "trading_bot.cli:main"

[dependency-groups]
dev = [
	"pytest>=8.0",
]

[build-system]
requires = ["hatchling", "editables"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_bot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
